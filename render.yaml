# Render "Blueprint" (Infrastructure as Code) para o TimeTracker
#
# ID do blueprint/deploy (Render): d29e88824b410ce44f2610ea6eec30bd
#
# Arquitetura: UM único serviço web. O backend FastAPI serve a API (/api/v1)
# e também a interface compilada (SPA) — tudo no mesmo domínio, sem CORS.
#
# Como usar:
#   1) Push deste repositório para o GitHub.
#   2) Em https://render.com → New → Blueprint → selecione o repositório.
#   3) O Render cria o PostgreSQL e o serviço web, e expõe a URL pública.

databases:
  - name: timetracker-db
    databaseName: timetracker
    user: timetracker
    plan: free
    ipAllowList: []

services:
  - type: web
    name: timetracker
    runtime: docker
    plan: free
    rootDir: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: timetracker-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '[]'