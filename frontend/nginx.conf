server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Serve SPA (fallback para rotas do React)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy da API para o backend.
    # BACKEND_URL é injetado por envsubst: docker-compose usa http://backend:8000,
    # Render usa a URL pública do serviço API (ex.: https://timetracker-api.onrender.com).
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}